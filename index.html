<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Pagos Escolares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pocketbase@latest/dist/pocketbase.umd.js"></script>
<style>
  :root{
    --ink:#1F3A34;
    --ink-2:#142720;
    --paper:#F6F1E4;
    --paper-2:#ECE3CC;
    --card:#FFFDF7;
    --gold:#B8923F;
    --gold-light:#D8B968;
    --coral:#D9694A;
    --coral-bg:#FBE6DE;
    --success:#3E8E63;
    --success-bg:#DDEFE2;
    --success-dark:#2C6B48;
    --text:#26261F;
    --muted:#6E6857;
    --line:rgba(31,58,52,0.16);
    --radius:14px;
    --shadow:0 12px 28px rgba(20,39,32,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  #app{max-width:960px;margin:0 auto;min-height:100vh;padding:0 0 60px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;}

  /* ---------- Top nav ---------- */
  .topbar{
    background:var(--ink);color:var(--paper);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:10px;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-light);}
  .topbar .brand span.label{font-family:'Fraunces',serif;font-size:16px;}
  .nav-tabs{display:flex;gap:6px;}
  .navtab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;color:var(--paper-2);}
  .navtab.active{background:var(--gold);color:#2B2109;}
  .content{padding:22px 18px 10px;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .card h2{margin:0 0 4px;font-size:19px;color:var(--ink);}
  .card .desc{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{
    flex:1;min-width:140px;background:var(--ink);color:var(--paper);border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold-light);}
  .stat .lab{font-size:12px;color:var(--paper-2);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
    background:var(--ink);color:var(--paper);width:100%;
  }
  .btn.gold{background:var(--gold);color:#2B2109;}
  .btn.outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn.small{padding:7px 12px;font-size:12.5px;width:auto;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  form.inline-form{display:grid;gap:10px;margin-top:6px;}
  form.inline-form label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
  form.inline-form input,form.inline-form select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;
  }
  .field-view{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;font-size:14px;}
  .field-view span.k{color:var(--muted);}
  .field-view span.v{font-weight:600;color:var(--ink);}

  .month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .month-head h2{margin:0;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .legend i.unpaid{background:#fff;border:2px solid var(--line);}
  .legend i.selected{background:var(--gold-light);border:2px solid var(--gold);}
  .legend i.requested{background:var(--coral-bg);border:2px solid var(--coral);}
  .legend i.validated{background:var(--success);}

  .accordion-item{border-top:1px solid var(--line);padding:10px 0;}
  .accordion-title{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:6px 0;}
  .accordion-title h3{margin:0;font-size:15px;color:var(--ink);}
  .accordion-title .chev{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;}
  .accordion-body{padding-top:10px;}
  .accordion-body.hidden{display:none;}
  .locked-tag{font-size:11px;background:var(--paper-2);color:var(--muted);padding:3px 8px;border-radius:20px;}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .meta{color:var(--muted);font-size:12px;}
  .list-row .amt{font-weight:700;color:var(--ink);white-space:nowrap;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{background:var(--paper-2);color:var(--ink);border-radius:7px;padding:5px 9px;font-size:12px;}
  .icon-btn.danger{background:var(--coral-bg);color:var(--coral);}

  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
  .tab{
    padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;
    background:var(--paper-2);color:var(--ink);
  }
  .tab.active{background:var(--ink);color:var(--paper);}

  table.paytable{width:100%;border-collapse:collapse;font-size:13px;}
  table.paytable th,table.paytable td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
  table.paytable th{color:var(--muted);font-weight:600;font-size:11.5px;}
  table.paytable td.name-cell{text-align:left;font-weight:600;color:var(--ink);}
  .table-scroll{overflow-x:auto;}
  .mini-circle{
    width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--muted);
  }
  .mini-circle.clickable{cursor:pointer;}
  .mini-circle.clickable:hover{border-color:var(--gold);}
  .mini-circle.selected-mini{background:var(--gold-light);border-color:var(--gold);color:#3A2C05;}
  .mini-circle.requested{background:var(--coral-bg);border-color:var(--coral);color:var(--coral);}
  .mini-circle.validated{background:var(--success);border-color:var(--success-dark);color:#fff;}

  .banner{
    background:var(--paper-2);border:1px dashed var(--gold);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink);margin-bottom:16px;
  }
  .error-text{color:var(--coral);font-size:12.5px;margin-top:4px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .admin-session-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--muted);}
  @media(max-width:480px){
    .stat-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="app"><div style="padding:40px 18px;text-align:center;color:#6E6857;font-family:'Inter',sans-serif;">Cargando datos…</div></div>

<script>
/* =========================================================
   DATOS Y ALMACENAMIENTO (PocketBase)
========================================================= */
// 1) Pon aquí la URL de tu servidor PocketBase.
//    Para probar en tu computadora mientras corres "./pocketbase serve": http://127.0.0.1:8090
//    Cuando lo subas a un hosting (Fly.io, Railway, un VPS, etc.), cambia esto por esa URL pública.
const POCKETBASE_URL='https://escolar-pocketbase.onrender.com';

const pb=new PocketBase(POCKETBASE_URL);
pb.autoCancellation(false);
let settingsId=null; // id del único registro de configuración en PocketBase
function errMsg(error){ return (error&&error.message)||String(error); }

function defaultDB(){
  return {
    students:[],
    payments:{},      // { studentId: { 'YYYY-MM': { weekIndex: {status,montoEntregado,cambio} } } }
    expenses:[],       // { id, nombre, fecha, monto }
    events:[],         // { id, nombre, fecha, montoTotal, pagos:{studentId:{status,montoEntregado,cambio}} }
    settings:{ weeklyAmount:20, adminPassword:'admin123', adminWhatsapp:'' }
  };
}
let db=defaultDB();
let dbReady=false;

async function loadDB(){
  try{
    const [students,payments,expenses,events,eventPayments,settingsList]=await Promise.all([
      pb.collection('students').getFullList({sort:'created'}),
      pb.collection('payments').getFullList(),
      pb.collection('expenses').getFullList(),
      pb.collection('events').getFullList(),
      pb.collection('event_payments').getFullList(),
      pb.collection('settings').getFullList()
    ]);

    const next=defaultDB();
    next.students=students.map(s=>({
      id:s.id, nombre:s.nombre, numLista:s.num_lista, nombrePadre:s.nombre_padre, whatsapp:s.whatsapp, createdAt:s.created
    }));
    payments.forEach(p=>{
      if(!next.payments[p.student_id]) next.payments[p.student_id]={};
      if(!next.payments[p.student_id][p.month_key]) next.payments[p.student_id][p.month_key]={};
      next.payments[p.student_id][p.month_key][p.week_index]={
        status:p.status, montoEntregado:p.monto_entregado, cambio:p.cambio
      };
    });
    next.expenses=expenses.map(e=>({id:e.id,nombre:e.nombre,fecha:e.fecha,monto:e.monto}));
    next.events=events.map(e=>({id:e.id,nombre:e.nombre,fecha:e.fecha,montoTotal:e.monto_total,pagos:{}}));
    eventPayments.forEach(ep=>{
      const ev=next.events.find(e=>e.id===ep.event_id);
      if(ev) ev.pagos[ep.student_id]={status:ep.status,montoEntregado:ep.monto_entregado,cambio:ep.cambio};
    });

    let settingsRec=settingsList[0];
    if(!settingsRec){
      // primera vez: crea el registro de configuración automáticamente
      settingsRec=await pb.collection('settings').create({weekly_amount:20,admin_password:'admin123',admin_whatsapp:''});
    }
    settingsId=settingsRec.id;
    next.settings={
      weeklyAmount:Number(settingsRec.weekly_amount),
      adminPassword:settingsRec.admin_password,
      adminWhatsapp:settingsRec.admin_whatsapp||''
    };
    db=next;
  }catch(error){
    console.error(error);
    document.getElementById('app').innerHTML=`<div style="padding:30px 18px;color:#D9694A;font-family:sans-serif;">
      No se pudo conectar con PocketBase. Revisa que POCKETBASE_URL sea correcta, que el servidor esté
      encendido y que las colecciones existan.<br><br><small>${errMsg(error)}</small></div>`;
    throw error;
  }
}

function saveDB(){ render(); } // los cambios ya se guardan en PocketBase en cada acción; esto solo re-renderiza

function subscribeRealtime(){
  pb.collection('students').subscribe('*',refreshFromServer);
  pb.collection('payments').subscribe('*',refreshFromServer);
  pb.collection('expenses').subscribe('*',refreshFromServer);
  pb.collection('events').subscribe('*',refreshFromServer);
  pb.collection('event_payments').subscribe('*',refreshFromServer);
  pb.collection('settings').subscribe('*',refreshFromServer);
}
let refreshQueued=false;
async function refreshFromServer(){
  if(refreshQueued) return;
  refreshQueued=true;
  setTimeout(async()=>{ refreshQueued=false; await loadDB(); render(); },250);
}

async function initApp(){
  try{
    await loadDB();
    dbReady=true;
    subscribeRealtime();
    render();
  }catch(e){ /* pantalla de error ya mostrada en loadDB */ }
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---- escrituras hacia PocketBase ---- */
async function sbInsertStudent(student){
  try{
    const rec=await pb.collection('students').create({
      nombre:student.nombre, num_lista:student.numLista, nombre_padre:student.nombrePadre, whatsapp:student.whatsapp
    });
    return rec.id;
  }catch(error){ alert('Error al registrar alumno: '+errMsg(error)); return null; }
}
async function sbUpdateStudent(s){
  try{
    await pb.collection('students').update(s.id,{
      nombre:s.nombre, num_lista:s.numLista, nombre_padre:s.nombrePadre, whatsapp:s.whatsapp
    });
  }catch(error){ alert('Error al guardar alumno: '+errMsg(error)); }
}
async function sbDeleteStudent(id){
  try{ await pb.collection('students').delete(id); }
  catch(error){ alert('Error al eliminar alumno: '+errMsg(error)); }
}
async function sbUpsertPayment(studentId,monthKey,weekIndex,status,montoEntregado,cambio){
  try{
    const filter=`student_id="${studentId}" && month_key="${monthKey}" && week_index=${weekIndex}`;
    let rec=null;
    try{ rec=await pb.collection('payments').getFirstListItem(filter); }catch(e){}
    const data={student_id:studentId, month_key:monthKey, week_index:weekIndex, status, monto_entregado:montoEntregado??null, cambio:cambio??null};
    if(rec) await pb.collection('payments').update(rec.id,data);
    else await pb.collection('payments').create(data);
  }catch(error){ alert('Error al guardar el pago: '+errMsg(error)); }
}
async function sbInsertExpense(ex){
  try{
    const rec=await pb.collection('expenses').create({nombre:ex.nombre,fecha:ex.fecha||null,monto:ex.monto});
    return rec.id;
  }catch(error){ alert('Error al registrar gasto: '+errMsg(error)); return null; }
}
async function sbUpdateExpense(ex){
  try{ await pb.collection('expenses').update(ex.id,{nombre:ex.nombre,fecha:ex.fecha||null,monto:ex.monto}); }
  catch(error){ alert('Error al guardar gasto: '+errMsg(error)); }
}
async function sbDeleteExpense(id){
  try{ await pb.collection('expenses').delete(id); }
  catch(error){ alert('Error al eliminar gasto: '+errMsg(error)); }
}
async function sbInsertEvent(ev){
  try{
    const rec=await pb.collection('events').create({nombre:ev.nombre,fecha:ev.fecha||null,monto_total:ev.montoTotal});
    return rec.id;
  }catch(error){ alert('Error al crear evento: '+errMsg(error)); return null; }
}
async function sbDeleteEvent(id){
  try{ await pb.collection('events').delete(id); } // los pagos relacionados se borran en cascada (cascadeDelete en la colección)
  catch(error){ alert('Error al eliminar evento: '+errMsg(error)); }
}
async function sbUpsertEventPayment(eventId,studentId,status,montoEntregado,cambio){
  try{
    const filter=`event_id="${eventId}" && student_id="${studentId}"`;
    let rec=null;
    try{ rec=await pb.collection('event_payments').getFirstListItem(filter); }catch(e){}
    const data={event_id:eventId, student_id:studentId, status, monto_entregado:montoEntregado??null, cambio:cambio??null};
    if(rec) await pb.collection('event_payments').update(rec.id,data);
    else await pb.collection('event_payments').create(data);
  }catch(error){ alert('Error al guardar el pago del evento: '+errMsg(error)); }
}
async function sbUpdateSettings(settings){
  try{
    await pb.collection('settings').update(settingsId,{
      weekly_amount:settings.weeklyAmount, admin_password:settings.adminPassword, admin_whatsapp:settings.adminWhatsapp
    });
  }catch(error){ alert('Error al guardar configuración: '+errMsg(error)); }
}
function money(n){ return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function digitsOnly(s){ return (s||'').replace(/\D/g,''); }
function waLink(phone,text){ return 'https://wa.me/'+digitsOnly(phone)+'?text='+encodeURIComponent(text); }

/* identidad del dispositivo (a qué alumno representa este navegador) */
function getMyStudentId(){ return localStorage.getItem('ge_student_id'); }
function setMyStudentId(id){ localStorage.setItem('ge_student_id',id); }

let adminUnlocked=false;

/* =========================================================
   CALENDARIO ESCOLAR (sep 2026 - jul 2027)
========================================================= */
const MONTH_NAMES=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function schoolMonths(){
  const list=[]; let y=2026,m=9;
  for(let i=0;i<11;i++){ list.push({year:y,month:m}); m++; if(m>12){m=1;y++;} }
  return list;
}
function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function monthLabel(y,m){ return MONTH_NAMES[m]+' '+y; }

function weeksOfMonth(y,m){
  const weeks=[]; const d=new Date(y,m-1,1);
  while(d.getMonth()+1===m){
    if(d.getDay()===1) weeks.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  if(weeks.length===0) weeks.push(new Date(y,m-1,1));
  return weeks;
}
function shortDate(d){ return d.getDate()+' '+MONTH_NAMES[d.getMonth()+1].slice(0,3).toLowerCase(); }

function currentMonthIndex(){
  const months=schoolMonths();
  const now=new Date();
  const idx=months.findIndex(mo=>mo.year===now.getFullYear()&&mo.month===now.getMonth()+1);
  if(idx!==-1) return idx;
  const first=months[0];
  if(now.getFullYear()<first.year || (now.getFullYear()===first.year && now.getMonth()+1<first.month)) return 0;
  return months.length-1;
}

/* =========================================================
   CALCULOS
========================================================= */
function studentPaidWeeksCount(studentId){
  const p=db.payments[studentId]||{};
  let count=0;
  Object.values(p).forEach(monthObj=>{
    Object.values(monthObj).forEach(entry=>{ if(entry&&entry.status==='validated') count++; });
  });
  return count;
}
function studentTotalPaid(studentId){
  let total=studentPaidWeeksCount(studentId)*db.settings.weeklyAmount;
  db.events.forEach(ev=>{
    const entry=ev.pagos&&ev.pagos[studentId];
    if(entry && entry.status==='validated') total+=eventCuota(ev);
  });
  return total;
}
function eventCuota(ev){
  const n=db.students.length||1;
  return ev.montoTotal/n;
}
function totalRecaudado(){
  let total=0;
  db.students.forEach(s=>{ total+=studentTotalPaid(s.id); });
  return total;
}
function totalGastos(){ return db.expenses.reduce((a,e)=>a+Number(e.monto||0),0); }
function pendingValidationsCount(){
  let count=0;
  db.students.forEach(s=>{
    const p=db.payments[s.id]||{};
    Object.values(p).forEach(monthObj=>Object.values(monthObj).forEach(entry=>{ if(entry&&entry.status==='requested') count++; }));
  });
  db.events.forEach(ev=>{ Object.values(ev.pagos||{}).forEach(entry=>{ if(entry&&entry.status==='requested') count++; }); });
  return count;
}

/* =========================================================
   ESTADO DE INTERFAZ (no persistente)
========================================================= */
let ui={
  screen:'home',            // 'home' | 'registro' | 'admin'
  selection:new Set(),
  expanded:new Set(),
  adminTab:'resumen',
  adminPayMonthIdx:currentMonthIndex(),
  showExpenseForm:false,
  editExpenseId:null,
  showEventForm:false,
  showStudentForm:false,
  editStudentId:null,
  loginError:''
};

function goHome(){ ui.screen='home'; render(); }
function goScreen(key){ ui.screen=key; render(); }

/* =========================================================
   RENDER PRINCIPAL
========================================================= */
function render(){
  const app=document.getElementById('app');
  if(ui.screen==='registro'){ app.innerHTML=renderRegistro(); bindRegistro(); }
  else if(ui.screen==='admin'){ app.innerHTML=renderAdminScreen(); bindAdminScreen(); }
  else { app.innerHTML=renderHome(); bindHome(); }
}

function topNavHTML(active){
  return `<div class="topbar">
    <div class="brand" onclick="goHome()"><span class="dot"></span><span class="label">Libro de Pagos</span></div>
    <div class="nav-tabs">
      <div class="navtab ${active==='registro'?'active':''}" onclick="goScreen('registro')">Registro</div>
      <div class="navtab ${active==='admin'?'active':''}" onclick="goScreen('admin')">Administrador</div>
    </div>
  </div>`;
}

/* =========================================================
   TABLA REUTILIZABLE DE PAGOS (para la pantalla principal)
========================================================= */
function renderHomeMonthTable(idx){
  const months=schoolMonths();
  const mo=months[idx];
  const key=monthKey(mo.year,mo.month);
  const weeks=weeksOfMonth(mo.year,mo.month);
  const myId=getMyStudentId();
  const isCurrent=idx===currentMonthIndex();
  const headWeeks=weeks.map(wd=>`<th>${shortDate(wd)}</th>`).join('');

  let rows='';
  if(db.students.length===0){
    rows=`<tr><td colspan="${weeks.length+1}"><div class="empty">Aún no hay alumnos registrados.</div></td></tr>`;
  } else {
    rows=db.students.map(s=>{
      const isMine=s.id===myId;
      const cells=weeks.map((wd,wi)=>{
        const entry=db.payments[s.id]&&db.payments[s.id][key]&&db.payments[s.id][key][wi];
        const status=(entry&&entry.status)||'unpaid';
        const selected=isMine&&isCurrent&&status==='unpaid'&&ui.selection.has(wi);
        let cls='mini-circle';
        let label='';
        if(status==='validated'){ cls+=' validated'; label='✓'; }
        else if(status==='requested'){ cls+=' requested'; label='…'; }
        else if(selected){ cls+=' selected-mini'; label='●'; }
        const clickable=isMine&&isCurrent&&status==='unpaid';
        if(clickable) cls+=' clickable';
        return `<td><div class="${cls}" ${clickable?`onclick="toggleWeekSelection(${wi})"`:''} title="Semana del ${shortDate(wd)}">${label}</div></td>`;
      }).join('');
      return `<tr ${isMine?'style="background:rgba(184,146,63,0.08);"':''}>
        <td class="name-cell">${s.nombre}${isMine?' <span class="locked-tag">Tú</span>':''}<div class="meta" style="font-weight:400;">Lista ${s.numLista}</div></td>
        ${cells}
      </tr>`;
    }).join('');
  }
  return `<div class="table-scroll"><table class="paytable"><thead><tr><th style="text-align:left;">Alumno</th>${headWeeks}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderEventsTable(){
  if(db.events.length===0) return '<div class="empty">No hay eventos activos por el momento.</div>';
  const myId=getMyStudentId();
  const headCols=db.events.map(ev=>`<th>${ev.nombre}<br><span style="font-weight:400;color:var(--muted);">${money(eventCuota(ev))}</span></th>`).join('');
  let rows='';
  if(db.students.length===0){
    rows=`<tr><td colspan="${db.events.length+1}"><div class="empty">Aún no hay alumnos registrados.</div></td></tr>`;
  } else {
    rows=db.students.map(s=>{
      const isMine=s.id===myId;
      const cells=db.events.map(ev=>{
        const entry=ev.pagos&&ev.pagos[s.id];
        const status=(entry&&entry.status)||'unpaid';
        let cls='mini-circle'; let label='';
        if(status==='validated'){ cls+=' validated'; label='✓'; }
        else if(status==='requested'){ cls+=' requested'; label='…'; }
        const clickable=isMine&&status==='unpaid';
        if(clickable) cls+=' clickable';
        return `<td><div class="${cls}" ${clickable?`onclick="requestEventPayment('${ev.id}')"`:''} title="${ev.nombre}">${label}</div></td>`;
      }).join('');
      return `<tr ${isMine?'style="background:rgba(184,146,63,0.08);"':''}><td class="name-cell">${s.nombre}${isMine?' <span class="locked-tag">Tú</span>':''}</td>${cells}</tr>`;
    }).join('');
  }
  return `<div class="table-scroll"><table class="paytable"><thead><tr><th style="text-align:left;">Alumno</th>${headCols}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderExpensesList(){
  if(db.expenses.length===0) return '<div class="empty">Aún no se han registrado gastos.</div>';
  return db.expenses.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(ex=>`
    <div class="list-row">
      <div><div style="font-weight:600;">${ex.nombre}</div><div class="meta">${ex.fecha}</div></div>
      <div class="amt">${money(ex.monto)}</div>
    </div>`).join('');
}

function bindHome(){
  const btnReq=document.getElementById('btn-request-payment');
  if(btnReq){
    btnReq.onclick=async()=>{
      const sid=getMyStudentId();
      const student=db.students.find(s=>s.id===sid);
      const months=schoolMonths();
      const mo=months[currentMonthIndex()];
      const key=monthKey(mo.year,mo.month);
      const weeks=weeksOfMonth(mo.year,mo.month);
      if(!db.payments[sid]) db.payments[sid]={};
      if(!db.payments[sid][key]) db.payments[sid][key]={};
      const selectedList=[...ui.selection].sort((a,b)=>a-b);
      selectedList.forEach(wi=>{ db.payments[sid][key][wi]={status:'requested'}; });
      const amount=selectedList.length*db.settings.weeklyAmount;
      const weekLabels=selectedList.map(wi=>shortDate(weeks[wi])).join(', ');
      ui.selection=new Set();
      saveDB();
      await Promise.all(selectedList.map(wi=>sbUpsertPayment(sid,key,wi,'requested',null,null)));
      const msg=`Hola, soy ${student.nombrePadre}, padre/tutor de ${student.nombre} (lista ${student.numLista}). `+
        `Solicito validar el pago de ${monthLabel(mo.year,mo.month)} - semanas: ${weekLabels}. Monto: ${money(amount)}.`;
      if(db.settings.adminWhatsapp){
        window.open(waLink(db.settings.adminWhatsapp,msg),'_blank');
      } else {
        alert('El administrador aún no configura su número de WhatsApp.');
      }
    };
  }
}

async function requestEventPayment(eventId){
  const sid=getMyStudentId();
  if(!sid){ alert('Regístrate primero en la pestaña Registro.'); return; }
  const student=db.students.find(s=>s.id===sid);
  const ev=db.events.find(e=>e.id===eventId);
  if(!ev.pagos) ev.pagos={};
  ev.pagos[sid]={status:'requested'};
  saveDB();
  await sbUpsertEventPayment(eventId,sid,'requested',null,null);
  const msg=`Hola, soy ${student.nombrePadre}, padre/tutor de ${student.nombre} (lista ${student.numLista}). `+
    `Solicito validar el pago del evento "${ev.nombre}". Monto: ${money(eventCuota(ev))}.`;
  if(db.settings.adminWhatsapp){
    window.open(waLink(db.settings.adminWhatsapp,msg),'_blank');
  } else {
    alert('El administrador aún no configura su número de WhatsApp.');
  }
}

async function cycleAdminWeek(studentId,key,wi){
  if(!db.payments[studentId]) db.payments[studentId]={};
  if(!db.payments[studentId][key]) db.payments[studentId][key]={};
  const entry=db.payments[studentId][key][wi]||{status:'unpaid'};
  const cur=entry.status||'unpaid';
  if(cur==='unpaid'){
    db.payments[studentId][key][wi]={status:'requested'};
    saveDB();
    await sbUpsertPayment(studentId,key,wi,'requested',null,null);
  } else if(cur==='requested'){
    const debe=db.settings.weeklyAmount;
    const input=prompt('¿Con cuánto pagó esta semana? (adeuda '+money(debe)+')');
    if(input===null) return;
    const montoEntregado=parseFloat(input);
    if(isNaN(montoEntregado)){ alert('Ingresa un monto válido.'); return; }
    const cambio=montoEntregado-debe;
    db.payments[studentId][key][wi]={status:'validated',montoEntregado,cambio};
    saveDB();
    await sbUpsertPayment(studentId,key,wi,'validated',montoEntregado,cambio);
  } else {
    db.payments[studentId][key][wi]={status:'unpaid'};
    saveDB();
    await sbUpsertPayment(studentId,key,wi,'unpaid',null,null);
  }
}
function confirmPaymentWhatsapp(studentId,key){
  const s=db.students.find(x=>x.id===studentId);
  const months=schoolMonths();
  const mo=months.find(m=>monthKey(m.year,m.month)===key);
  const weeks=weeksOfMonth(mo.year,mo.month);
  const payMonth=(db.payments[studentId]&&db.payments[studentId][key])||{};
  const validatedWeeks=Object.keys(payMonth).filter(wi=>payMonth[wi]&&payMonth[wi].status==='validated').map(wi=>shortDate(weeks[wi]));
  if(validatedWeeks.length===0){ alert('Este alumno no tiene semanas validadas en '+monthLabel(mo.year,mo.month)+'.'); return; }
  const msg=`Hola ${s.nombrePadre}, se confirma el pago de ${s.nombre} (lista ${s.numLista}) correspondiente a ${monthLabel(mo.year,mo.month)} - semanas: ${validatedWeeks.join(', ')}. ¡Gracias!`;
  if(!s.whatsapp){ alert('Este alumno no tiene número de WhatsApp registrado.'); return; }
  window.open(waLink(s.whatsapp,msg),'_blank');
}

  s.whatsapp=f.whatsapp.value.trim();

async function deleteStudent(id){
  if(!confirm('¿Eliminar a este alumno y su historial de pagos?')) return;
  db.students=db.students.filter(s=>s.id!==id);
  delete db.payments[id];
  db.events.forEach(ev=>{ if(ev.pagos) delete ev.pagos[id]; });
  saveDB();
  await sbDeleteStudent(id); // los pagos relacionados se borran en cascada en Supabase
}

        return `<div class="list-row" style="flex-direction:column;align-items:stretch;">
          <form class="inline-form" onsubmit="return saveExpenseEdit(event,'${ex.id}')">
            <div><label>Nombre del gasto</label><input type="text" name="nombre" value="${ex.nombre}"></div>
            <div><label>Fecha</label><input type="date" name="fecha" value="${ex.fecha}"></div>
            <div><label>Monto</label><input type="number" step="0.01" name="monto" value="${ex.monto}"></div>
            <div class="row-actions">
              <button type="submit" class="btn small gold">Guardar</button>
              <button type="button" class="icon-btn" onclick="ui.editExpenseId=null;render();">Cancelar</button>
            </div>
          </form>
        </div>`;
      }
      return `<div class="list-row">
        <div><div style="font-weight:600;">${ex.nombre}</div><div class="meta">${ex.fecha}</div></div>
        <div class="amt">${money(ex.monto)}</div>
        <div class="row-actions">
          <button class="icon-btn" onclick="ui.editExpenseId='${ex.id}';render();">Editar</button>
          <button class="icon-btn danger" onclick="deleteExpense('${ex.id}')">Eliminar</button>
        </div>
      </div>`;
    }).join('');
  }
  return `<div class="card">
    <h2>Gastos del ciclo escolar</h2>
    <p class="desc">Total acumulado: <strong>${money(totalGastos())}</strong></p>
    ${rows}
    <div style="margin-top:14px;">
      ${ui.showExpenseForm?`
        <form class="inline-form" id="form-new-expense">
          <div><label>Nombre del gasto</label><input type="text" id="ex-nombre" required></div>
          <div><label>Fecha</label><input type="date" id="ex-fecha" required></div>
          <div><label>Monto</label><input type="number" step="0.01" id="ex-monto" required></div>
          <div class="row-actions">
            <button type="submit" class="btn small gold">Registrar gasto</button>
            <button type="button" class="icon-btn" id="btn-cancel-expense">Cancelar</button>
          </div>
        </form>`:`<button class="btn outline" id="btn-show-expense-form">+ Registrar gasto</button>`}
    </div>
  </div>`;
}
async function saveExpenseEdit(e,id){
  e.preventDefault();
  const f=e.target;
  const ex=db.expenses.find(x=>x.id===id);
  ex.nombre=f.nombre.value.trim(); ex.fecha=f.fecha.value; ex.monto=parseFloat(f.monto.value)||0;
  ui.editExpenseId=null; saveDB();
  await sbUpdateExpense(ex);
  return false;
}
async function deleteExpense(id){
  if(!confirm('¿Eliminar este gasto?')) return;
  db.expenses=db.expenses.filter(e=>e.id!==id);
  saveDB();
  await sbDeleteExpense(id);
}

function renderAdminEventos(){
  let rows='';
  if(db.events.length===0){
    rows='<div class="empty">No hay eventos creados.</div>';
  } else {
    rows=db.events.map(ev=>{
      const cuota=eventCuota(ev);
      const studentRows=db.students.length? db.students.map(s=>{
        const entry=ev.pagos&&ev.pagos[s.id];
        const status=(entry&&entry.status)||'unpaid';
        const cls=status==='validated'?'validated':(status==='requested'?'requested':'');
        let label=status==='validated'?'✓ Pagado':(status==='requested'?'Esperando validación':'Sin pagar');
        let montoLine='';
        if(status==='validated'&&entry.montoEntregado!=null){
          const dif=Number(entry.montoEntregado)-eventCuota(ev);
          const difTxt=dif>0?`Sobra ${money(dif)}`:(dif<0?`Falta ${money(-dif)}`:'Exacto');
          montoLine=`<div class="meta">Entregó ${money(entry.montoEntregado)} · ${difTxt}</div>`;
        }
        return `<div class="list-row">
          <div>${s.nombre} <span class="meta">(lista ${s.numLista})</span>${montoLine}</div>
          <div class="row-actions">
            <span class="mini-circle clickable ${cls}" onclick="cycleEventPayment('${ev.id}','${s.id}')" title="${label}">${status==='validated'?'✓':(status==='requested'?'…':'')}</span>
            <button class="icon-btn" onclick="confirmEventWhatsapp('${ev.id}','${s.id}')">WhatsApp</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty">No hay alumnos registrados.</div>';

      return `<div class="card" style="background:var(--paper-2);box-shadow:none;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <h2 style="margin-bottom:2px;">${ev.nombre}</h2>
            <p class="desc">${ev.fecha||''} · Monto a recaudar: ${money(ev.montoTotal)} · Cuota por alumno: ${money(cuota)}</p>
          </div>
          <button class="icon-btn danger" onclick="deleteEvent('${ev.id}')">Eliminar</button>
        </div>
        ${studentRows}
      </div>`;
    }).join('');
  }

  return `<div class="card">
    <h2>Eventos del ciclo escolar</h2>
    <p class="desc">Crea un evento y el monto se divide entre los alumnos registrados.</p>
    ${ui.showEventForm?`
      <form class="inline-form" id="form-new-event">
        <div><label>Nombre del evento</label><input type="text" id="ev-nombre" required></div>
        <div><label>Fecha</label><input type="date" id="ev-fecha"></div>
        <div><label>Monto total a recaudar</label><input type="number" step="0.01" id="ev-monto" required></div>
        <div class="row-actions">
          <button type="submit" class="btn small gold">Crear evento</button>
          <button type="button" class="icon-btn" id="btn-cancel-event">Cancelar</button>
        </div>
      </form>`:`<button class="btn outline" id="btn-show-event-form">+ Crear evento</button>`}
  </div>
  ${rows}`;
}
async function cycleEventPayment(eventId,studentId){
  const ev=db.events.find(e=>e.id===eventId);
  if(!ev.pagos) ev.pagos={};
  const entry=ev.pagos[studentId]||{status:'unpaid'};
  const cur=entry.status||'unpaid';
  if(cur==='unpaid'){
    ev.pagos[studentId]={status:'requested'};
    saveDB();
    await sbUpsertEventPayment(eventId,studentId,'requested',null,null);
  } else if(cur==='requested'){
    const debe=eventCuota(ev);
    const input=prompt('¿Con cuánto pagó este evento? (adeuda '+money(debe)+')');
    if(input===null) return;
    const montoEntregado=parseFloat(input);
    if(isNaN(montoEntregado)){ alert('Ingresa un monto válido.'); return; }
    const cambio=montoEntregado-debe;
    ev.pagos[studentId]={status:'validated',montoEntregado,cambio};
    saveDB();
    await sbUpsertEventPayment(eventId,studentId,'validated',montoEntregado,cambio);
  } else {
    ev.pagos[studentId]={status:'unpaid'};
    saveDB();
    await sbUpsertEventPayment(eventId,studentId,'unpaid',null,null);
  }
}
function confirmEventWhatsapp(eventId,studentId){
  const ev=db.events.find(e=>e.id===eventId);
  const s=db.students.find(x=>x.id===studentId);
  const entry=ev.pagos&&ev.pagos[studentId];
  if(!entry||entry.status!=='validated'){ alert('Este pago aún no está validado.'); return; }
  if(!s.whatsapp){ alert('Este alumno no tiene número de WhatsApp registrado.'); return; }
  const msg=`Hola ${s.nombrePadre}, se confirma el pago de ${s.nombre} para el evento "${ev.nombre}" por ${money(eventCuota(ev))}. ¡Gracias!`;
  window.open(waLink(s.whatsapp,msg),'_blank');
}
async function deleteEvent(id){
  if(!confirm('¿Eliminar este evento?')) return;
  db.events=db.events.filter(e=>e.id!==id);
  saveDB();
  await sbDeleteEvent(id);
}

function renderAdminAjustes(){
  return `
  <div class="card">
    <h2>Configuración</h2>
    <form class="inline-form" id="form-settings">
      <div><label>Cuota semanal por alumno</label><input type="number" step="0.01" id="set-weekly" value="${db.settings.weeklyAmount}"></div>
      <div><label>WhatsApp del administrador (recibe solicitudes de validación)</label><input type="tel" id="set-whatsapp" value="${db.settings.adminWhatsapp}" placeholder="10 dígitos + lada"></div>
      <div><label>Cambiar contraseña de administrador</label><input type="text" id="set-password" value="${db.settings.adminPassword}"></div>
      <button type="submit" class="btn gold">Guardar cambios</button>
    </form>
    <div class="hint">Esta contraseña se guarda solo en este dispositivo/navegador; no ofrece seguridad de nivel bancario.</div>
  </div>`;
}

function bindAdminPanelContent(){
  document.getElementById('btn-lock-admin').onclick=()=>{ adminUnlocked=false; goHome(); };
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{ ui.adminTab=t.dataset.tab; render(); };
  });

  if(ui.adminTab==='pagos'){
    const sel=document.getElementById('admin-month-select');
    if(sel) sel.onchange=()=>{ ui.adminPayMonthIdx=parseInt(sel.value,10); render(); };
  }

  if(ui.adminTab==='alumnos'){
    const showBtn=document.getElementById('btn-show-student-form');
    if(showBtn) showBtn.onclick=()=>{ ui.showStudentForm=true; render(); };
    const cancelBtn=document.getElementById('btn-cancel-student');
    if(cancelBtn) cancelBtn.onclick=()=>{ ui.showStudentForm=false; render(); };
    const form=document.getElementById('form-new-student');
    if(form) form.onsubmit=async(e)=>{
      e.preventDefault();
      const nombre=document.getElementById('as-nombre').value.trim();
      const numLista=document.getElementById('as-lista').value.trim();
      const nombrePadre=document.getElementById('as-padre').value.trim();
      const whatsapp=document.getElementById('as-whatsapp').value.trim();
      if(!nombre||!numLista||!nombrePadre||!whatsapp) return;
      const submitBtn=form.querySelector('button[type="submit"]');
      submitBtn.disabled=true; submitBtn.textContent='Guardando…';
      const id=await sbInsertStudent({nombre,numLista,nombrePadre,whatsapp});
      if(!id){ submitBtn.disabled=false; submitBtn.textContent='Registrar alumno'; return; }
      db.students.push({id,nombre,numLista,nombrePadre,whatsapp,createdAt:Date.now()});
      ui.showStudentForm=false;
      saveDB();
    };
  }

  if(ui.adminTab==='gastos'){
    const showBtn=document.getElementById('btn-show-expense-form');
    if(showBtn) showBtn.onclick=()=>{ ui.showExpenseForm=true; render(); };
    const cancelBtn=document.getElementById('btn-cancel-expense');
    if(cancelBtn) cancelBtn.onclick=()=>{ ui.showExpenseForm=false; render(); };
    const form=document.getElementById('form-new-expense');
    if(form) form.onsubmit=async(e)=>{
      e.preventDefault();
      const nombre=document.getElementById('ex-nombre').value.trim();
      const fecha=document.getElementById('ex-fecha').value;
      const monto=parseFloat(document.getElementById('ex-monto').value)||0;
      const id=await sbInsertExpense({nombre,fecha,monto});
      if(!id) return;
      db.expenses.push({ id, nombre, fecha, monto });
      ui.showExpenseForm=false;
      saveDB();
    };
  }

  if(ui.adminTab==='eventos'){
    const showBtn=document.getElementById('btn-show-event-form');
    if(showBtn) showBtn.onclick=()=>{ ui.showEventForm=true; render(); };
    const cancelBtn=document.getElementById('btn-cancel-event');
    if(cancelBtn) cancelBtn.onclick=()=>{ ui.showEventForm=false; render(); };
    const form=document.getElementById('form-new-event');
    if(form) form.onsubmit=async(e)=>{
      e.preventDefault();
      const nombre=document.getElementById('ev-nombre').value.trim();
      const fecha=document.getElementById('ev-fecha').value;
      const montoTotal=parseFloat(document.getElementById('ev-monto').value)||0;
      const id=await sbInsertEvent({nombre,fecha,montoTotal});
      if(!id) return;
      db.events.push({ id, nombre, fecha, montoTotal, pagos:{} });
      ui.showEventForm=false;
      saveDB();
    };
  }

  if(ui.adminTab==='ajustes'){
    document.getElementById('form-settings').onsubmit=async(e)=>{
      e.preventDefault();
      db.settings.weeklyAmount=parseFloat(document.getElementById('set-weekly').value)||0;
      db.settings.adminWhatsapp=document.getElementById('set-whatsapp').value.trim();
      db.settings.adminPassword=document.getElementById('set-password').value.trim()||db.settings.adminPassword;
      saveDB();
      await sbUpdateSettings(db.settings);
      alert('Configuración guardada.');
    };
  }
}

/* =========================================================
   ARRANQUE

initApp();
</script>
